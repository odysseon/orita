<div
  class="app-layout"
  [class.app-layout--with-side-nav]="showNav() && isDesktop() && !isLanding()"
  [class.app-layout--with-bottom-nav]="showNav() && !isDesktop() && !isLanding()"
>
  <main class="app-main">
    <router-outlet />
  </main>

  @if (showNav() && !isLanding()) {
  <ui-nav-list
    [position]="isDesktop() ? 'side' : 'bottom'"
    [justify]="isDesktop() ? 'start' : 'around'"
    [uiScrollHide]="!isDesktop()"
    [expanded]="false"
  >
    <ui-nav-item
      [layout]="isDesktop() ? 'horizontal' : 'vertical'"
      iconSize="md"
      [active]="isActive('/home')"
      (clicked)="go('/home')"
    >
      <svg icon lucideHouse aria-hidden="true"></svg>
      <span label>Home</span>
    </ui-nav-item>

    <ui-nav-item
      [layout]="isDesktop() ? 'horizontal' : 'vertical'"
      iconSize="md"
      [active]="isActive('/search')"
      (clicked)="go('/search')"
    >
      <svg icon lucideSearch aria-hidden="true"></svg>
      <span label>Search</span>
    </ui-nav-item>

    <ui-nav-item
      [layout]="isDesktop() ? 'horizontal' : 'vertical'"
      iconSize="md"
      [active]="isActive('/tours')"
      (clicked)="go('/tours')"
    >
      <svg icon lucideCompass aria-hidden="true"></svg>
      <span label>Tours</span>
    </ui-nav-item>

    <ui-nav-item
      [layout]="isDesktop() ? 'horizontal' : 'vertical'"
      iconSize="md"
      [active]="isActive('/messages')"
      (clicked)="go('/messages')"
    >
      <svg icon lucideMessageCircle aria-hidden="true"></svg>
      <span label>Activity</span>
      @if (notificationService.unreadCount() > 0) {
        <app-badge intent="error" appearance="solid" class="nav-badge">{{ notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount() }}</app-badge>
      }
    </ui-nav-item>

    <ui-nav-item
      [layout]="isDesktop() ? 'horizontal' : 'vertical'"
      iconSize="md"
      [active]="isActive('/nearby')"
      (clicked)="go('/nearby')"
    >
      <svg icon lucideMapPin aria-hidden="true"></svg>
      <span label>Nearby</span>
    </ui-nav-item>
  </ui-nav-list>
  }
</div>

<app-toast-container />
