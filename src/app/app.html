<div
  class="app-layout"
  [class.app-layout--with-side-nav]="showNav() && isDesktop() && !isLanding()"
  [class.app-layout--with-bottom-nav]="showNav() && !isDesktop() && !isLanding()"
>
  <main class="app-main">
    <router-outlet />
  </main>

  @if (showNav() && !isLanding()) {
  <ui-tabs
    [value]="currentNavValue()"
    class="root-app-navigation"
    [class.root-app-navigation--side]="isDesktop()"
    [class.root-app-navigation--bottom]="!isDesktop()"
    [uiScrollHide]="!isDesktop()"
  >
    <ui-tab-list appearance="pill" size="md" [fullWidth]="!isDesktop()">
      <button app-button app-tab-trigger value="home" (click)="go('/home')" class="nav-tab-button">
        <svg icon lucideHouse aria-hidden="true"></svg>
        <span class="nav-tab-label">Home</span>
      </button>

      <button app-button app-tab-trigger value="search" (click)="go('/search')" class="nav-tab-button">
        <svg icon lucideSearch aria-hidden="true"></svg>
        <span class="nav-tab-label">Search</span>
      </button>

      <button app-button app-tab-trigger value="tours" (click)="go('/tours')" class="nav-tab-button">
        <svg icon lucideCompass aria-hidden="true"></svg>
        <span class="nav-tab-label">Tours</span>
      </button>

      <button app-button app-tab-trigger value="messages" (click)="go('/messages')" class="nav-tab-button">
        <svg icon lucideMessageCircle aria-hidden="true"></svg>
        <span class="nav-tab-label">Activity</span>
        @if (notificationService.unreadCount() > 0) {
          <app-badge intent="error" appearance="solid" class="nav-badge">{{ notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount() }}</app-badge>
        }
      </button>

      <button app-button app-tab-trigger value="nearby" (click)="go('/nearby')" class="nav-tab-button">
        <svg icon lucideMapPin aria-hidden="true"></svg>
        <span class="nav-tab-label">Nearby</span>
      </button>
    </ui-tab-list>
  </ui-tabs>
  }
</div>

<app-toast-container />
