<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-xl relative max-h-full overflow-y-auto">
    <button class="absolute top-4 right-4 p-2 text-gray-500 hover:bg-gray-100 rounded-full" (click)="close.emit()">
      ✕
    </button>
    
    <h2 class="text-2xl font-bold mb-6">New Post</h2>

    @if (error()) {
      <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="field">
        <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
        <select [(ngModel)]="model.type" name="type" required class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50">
          @for (type of types; track type.value) {
            <option [value]="type.value">{{ type.label }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input [(ngModel)]="model.title" name="title" required placeholder="What's happening?" class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50" />
      </div>

      <div class="field">
        <label class="block text-sm font-medium text-gray-700 mb-1">Details (Optional)</label>
        <textarea [(ngModel)]="model.body" name="body" rows="4" placeholder="Add more details..." class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50"></textarea>
      </div>

      <div class="mt-4 flex gap-3">
        <button type="button" class="btn btn-outline flex-1 py-3" (click)="close.emit()" [disabled]="loading()">Cancel</button>
        <button type="submit" class="btn btn-primary flex-1 py-3" [disabled]="loading() || !model.title">
          {{ loading() ? 'Posting...' : 'Post' }}
        </button>
      </div>
    </form>
  </div>
</div>
