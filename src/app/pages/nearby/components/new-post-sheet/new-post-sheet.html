<ui-drawer [open]="true" position="bottom" size="lg" [showCloseButton]="false" (closed)="close.emit()">
  <div class="new-post-content">

    <button app-button appearance="ghost" shape="circle" class="btn-icon new-post-close" (click)="close.emit()" aria-label="Close">
      <svg lucideX aria-hidden="true"></svg>
    </button>

    <h2 class="section__title new-post-title">New Post</h2>

    @if (postForm().errors().length > 0) {
      <div class="new-post-error">{{ postForm().errors()[0].message }}</div>
    }

    <form [formRoot]="postForm" class="stack">
      <app-form-field
        label="Type"
        fieldId="post-type"
        [invalid]="postForm.type().touched() && postForm.type().invalid()"
        [errorMessage]="postForm.type().errors()[0]?.message"
      >
        <select id="post-type" app-select [formField]="postForm.type">
          @for (type of types; track type.value) {
            <option [value]="type.value">{{ type.label }}</option>
          }
        </select>
      </app-form-field>

      <app-form-field
        label="Title"
        fieldId="post-title"
        [invalid]="postForm.title().touched() && postForm.title().invalid()"
        [errorMessage]="postForm.title().errors()[0]?.message"
      >
        <input
          id="post-title"
          app-input
          placeholder="What's happening?"
          [formField]="postForm.title"
          [attr.aria-invalid]="postForm.title().touched() && postForm.title().invalid()"
        />
      </app-form-field>

      <app-form-field
        label="Details"
        fieldId="post-body"
        [optional]="true"
      >
        <textarea
          id="post-body"
          app-textarea
          placeholder="Add more details..."
          [formField]="postForm.body"
        ></textarea>
      </app-form-field>

      <div class="new-post-actions cluster">
        <button
          app-button
          type="button"
          appearance="ghost"
          (click)="close.emit()"
          [disabled]="postForm().submitting()"
        >
          Cancel
        </button>

        <button
          app-button
          type="submit"
          intent="primary"
          [disabled]="postForm().submitting() || postForm().invalid()"
          [loading]="postForm().submitting()"
        >
          Post
        </button>
      </div>
    </form>
  </div>
</ui-drawer>
