<ui-drawer [open]="true" position="bottom" size="auto" [showCloseButton]="false" (closed)="close.emit()">
  <div style="padding: var(--space-lg); padding-bottom: calc(var(--space-lg) + env(safe-area-inset-bottom)); position: relative; background: var(--surface-page);">
    
    <button class="btn-icon" style="position: absolute; top: var(--space-md); right: var(--space-md);" (click)="close.emit()">
      <svg lucideX aria-hidden="true"></svg>
    </button>
    
    <h2 class="section__title" style="margin-top: 0; margin-bottom: var(--space-lg);">New Post</h2>

    @if (error()) {
      <div class="surface-container" style="padding: var(--space-md); border-radius: var(--radius-md); color: var(--clr-error); margin-bottom: var(--space-md); border: 1px solid var(--clr-error-container);">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="submit()" class="stack">
      <div class="field">
        <label class="field__label">Type</label>
        <select [(ngModel)]="model.type" name="type" required class="field__select">
          @for (type of types; track type.value) {
            <option [value]="type.value">{{ type.label }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label class="field__label">Title</label>
        <input [(ngModel)]="model.title" name="title" required placeholder="What's happening?" class="field__input" />
      </div>

      <div class="field">
        <label class="field__label">Details (Optional)</label>
        <textarea [(ngModel)]="model.body" name="body" placeholder="Add more details..." class="field__textarea"></textarea>
      </div>

      <div class="cluster" style="margin-top: var(--space-md); flex-wrap: nowrap; gap: var(--space-md);">
        <button type="button" class="btn btn--ghost" style="flex: 1;" (click)="close.emit()" [disabled]="loading()">Cancel</button>
        <button type="submit" class="btn btn--primary" style="flex: 1;" [disabled]="loading() || !model.title">
          @if (loading()) {
            <svg lucideLoaderCircle class="spin" aria-hidden="true"></svg>
          } @else {
            Post
          }
        </button>
      </div>
    </form>
  </div>
</ui-drawer>
