<app-section>
  <header class="section-header">
    @if (content.eyebrow) {
    <p class="section-header__eyebrow">{{ content.eyebrow }}</p>
    }

    <h2 class="section-header__title">
      @for (line of content.title; track line) {
      <span>{{ line }}</span>
      }
    </h2>

    @if (content.description) {
    <p class="section-header__description">{{ content.description }}</p>
    }
  </header>

  <div class="cards">
    @for (card of cards; track card.title) {

    <app-marketing-card [title]="card.title" [description]="card.description" />

    }
  </div>
</app-section>
