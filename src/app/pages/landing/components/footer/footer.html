<footer class="footer section">
  <div class="container">
    <div class="footer__top">
      <div class="footer__brand">
        <h2>Oríta</h2>

        <p>Discover everything your neighborhood has to offer.</p>
      </div>

      <nav class="footer__nav">
        <h3>Platform</h3>
        @for (link of links; track link.route) {
          <a [routerLink]="link.route"> {{ link.label }} </a>
        }
      </nav>

      <nav class="footer__nav">
        <h3>Legal</h3>
        @for (link of legalLinks; track link.route) {
          <a [routerLink]="link.route"> {{ link.label }} </a>
        }
      </nav>
    </div>

    <app-divider></app-divider>

    <div class="footer__bottom">
      <span> © {{ year }} Oríta. </span>

      <span> Built for local discovery. </span>
    </div>
  </div>
</footer>
