<app-section>
  <app-section-header
    [eyebrow]="content.eyebrow"
    [title]="content.title"
    [description]="content.description"
  />

  <div class="comparison">
    <section class="comparison__column">
      <h3>Today</h3>

      <ul>
        @for (item of today; track item) {

        <li>
          <span class="negative">×</span>

          {{ item }}
        </li>

        }
      </ul>
    </section>

    <section class="comparison__column comparison__column--positive">
      <h3>With Oríta</h3>

      <ul>
        @for (item of orita; track item) {

        <li>
          <span class="positive">✓</span>

          {{ item }}
        </li>

        }
      </ul>
    </section>
  </div>
</app-section>
