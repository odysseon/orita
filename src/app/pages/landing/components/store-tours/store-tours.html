<app-section width="xl">
  <app-section-header
    [eyebrow]="content.eyebrow"
    [title]="content.title"
    [description]="content.description"
  />

  <div class="tour">
    <div class="tour__preview">
      <div class="tour__hero">
        <div class="tour__badge">Store Tour</div>
      </div>

      <div class="tour__gallery">
        @for (item of [1,2,3]; track item) {

        <div class="tour__thumbnail"></div>

        }
      </div>
    </div>

    <aside class="tour__content">
      <h3>Explore businesses before stepping inside.</h3>

      <p>
        Store Tours help you understand the atmosphere, products and environment before making the
        trip.
      </p>

      <ul>
        @for (benefit of benefits; track benefit) {

        <li>✓ {{ benefit }}</li>

        }
      </ul>
    </aside>
  </div>
</app-section>
