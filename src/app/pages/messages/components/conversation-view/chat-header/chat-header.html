<header class="chat-header">
      <button class="btn-back" (click)="back.emit()" aria-label="Back">
        <svg lucideChevronLeft aria-hidden="true"></svg>
      </button>

      <div class="chat-title-info">
        @if (conversation()?.anchor?.imageUrl) {
          <img [src]="conversation()?.anchor?.imageUrl" alt="Avatar" class="avatar-placeholder" style="object-fit: cover; background: none; color: transparent;" />
        } @else {
          <div class="avatar-placeholder">
            {{ (conversation()?.title || conversation()?.anchor?.title || 'U')[0] }}
          </div>
        }
        <div class="chat-title-text">
          <h2>{{ conversation()?.title || conversation()?.anchor?.title || 'Conversation' }}</h2>
          <span class="online-status">Online</span>
        </div>
      </div>

      <button class="btn-icon" aria-label="More options">
        <svg lucideMoreVertical aria-hidden="true"></svg>
      </button>
    </header>
