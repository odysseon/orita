<div class="view-container">
  @if (conversation()) {
    <ui-app-header [showLogo]="false" [showLocationPill]="false" [showProfileBtn]="false">
      <div left-content class="view-header-left">
        <button app-button appearance="ghost" shape="square" class="btn-icon" (click)="back.emit()" aria-label="Go back">
          <svg lucideArrowLeft aria-hidden="true"></svg>
        </button>
        <div class="view-header-user">
          @if (conversation()!.avatarUrl) {
            <img [src]="conversation()!.avatarUrl" alt="Avatar" class="view-header-avatar" />
          } @else {
            <div class="view-header-avatar-placeholder">
              <svg lucideUser aria-hidden="true"></svg>
            </div>
          }
          <h3 class="view-header-title">{{ conversation()!.title || 'Conversation' }}</h3>
        </div>
      </div>
    </ui-app-header>

    <app-conversation-context [anchor]="conversation()!.anchor ?? null" />

    <app-message-list
      [messages]="messages()"
      [viewerParticipantId]="viewerParticipantId()"
      (retryMessage)="retry.emit($event)"
      (discardMessage)="discard.emit($event)"
    />

    <app-message-composer
      [conversationId]="conversation()?.id"
      (send)="onSend($event)"
    />
  } @else {
    <div class="empty-view">
      <div class="empty-icon">
      <svg lucideMessageCircleMore></svg>
      </div>
      <h3>Your Messages</h3>
      <p>Select a conversation from the sidebar to start chatting.</p>
    </div>
  }
</div>
