<button 
      class="conv-item" 
      [class.active]="isActive()" 
      [class.unread]="conversation().unreadCount > 0"
      (click)="select.emit(conversation().id)"
    >
      <div class="conv-avatar">
        <app-avatar
          [src]="conversation().avatarUrl"
          [alt]="conversation().title || 'User'"
          [fallback]="conversation().title ? conversation().title.charAt(0).toUpperCase() : 'U'"
          size="md"
        ></app-avatar>
        @if (conversation().unreadCount > 0) {
          <div class="unread-badge">{{ conversation().unreadCount }}</div>
        }
      </div>

      <div class="conv-content">
        <div class="conv-header">
          <span class="conv-title">{{ conversation().title }}</span>
          @if (conversation().lastActivityAt) {
            <span class="conv-time">{{ conversation().lastActivityAt | date:'shortTime' }}</span>
          }
        </div>
        
        <div class="conv-snippet">
          @if (conversation().latestMessage) {
            <span class="snippet-text">
              @if (conversation().latestMessage?.senderDisplayName === 'You') {
                You: 
              }
              @switch (conversation().latestMessage!.descriptor.kind) {
                @case ('EMBED') {
                  @if ($any(conversation().latestMessage!.descriptor).embedType === 'BUSINESS') {
                    <svg icon lucideMapPin aria-hidden="true" class="snippet-icon"></svg>
                  }
                  @if ($any(conversation().latestMessage!.descriptor).embedType === 'LISTING') {
                    <svg icon lucideShoppingBag aria-hidden="true" class="snippet-icon"></svg>
                  }
                  @if ($any(conversation().latestMessage!.descriptor).embedType === 'LOCATION') {
                    <svg icon lucideMap aria-hidden="true" class="snippet-icon"></svg>
                  }
                  @if ($any(conversation().latestMessage!.descriptor).embedType === 'TOUR') {
                    <svg icon lucideFootprints aria-hidden="true" class="snippet-icon"></svg>
                  }
                }
                @case ('ATTACHMENT') {
                  @if ($any(conversation().latestMessage!.descriptor).attachmentType === 'VIDEO') {
                    <svg icon lucideVideo aria-hidden="true" class="snippet-icon"></svg>
                  } @else {
                    <svg icon lucideImage aria-hidden="true" class="snippet-icon"></svg>
                  }
                }
              }
              {{ conversation().latestMessage!.descriptor | messagePreview }}
            </span>
          } @else {
            <span class="snippet-text">No messages yet</span>
          }
        </div>
      </div>
    </button>
