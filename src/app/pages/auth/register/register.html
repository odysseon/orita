<app-auth-card
  subtitle="Create an account to get started"
  footerText="Already have an account?"
  footerLinkLabel="Sign in"
  footerLinkRoute="/auth/login"
>
  <form class="auth-form" (submit)="onSubmit($event)">
    <app-form-field
      label="Username"
      fieldId="username"
      [invalid]="registerForm.username().invalid()"
      [errorMessage]="registerForm.username().errors()[0]?.message"
    >
      <input
        id="username"
        class="app-input"
        type="text"
        placeholder="hammed_anu"
        autocomplete="username"
        [formField]="registerForm.username"
        [attr.aria-invalid]="registerForm.username().touched() && registerForm.username().invalid()"
      />
    </app-form-field>

    <app-form-field
      label="Email"
      fieldId="email"
      [invalid]="registerForm.email().invalid()"
      [errorMessage]="registerForm.email().errors()[0]?.message"
    >
      <input
        id="email"
        class="app-input"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        [formField]="registerForm.email"
        [attr.aria-invalid]="registerForm.email().touched() && registerForm.email().invalid()"
      />
    </app-form-field>

    <ui-password-field
      label="Password"
      fieldId="password"
      [formField]="registerForm.password"
      [invalid]="registerForm.password().invalid()"
      [errorMessage]="registerForm.password().errors()[0]?.message"
    ></ui-password-field>

    <p class="auth-form__legal">
      By creating an account, you agree to our 
      <a routerLink="/legal/terms" class="auth-form__link">Terms of Service</a> and 
      <a routerLink="/legal/privacy" class="auth-form__link">Privacy Policy</a>.
    </p>

    <button
      app-button
      intent="primary"
      fullWidth
      class="auth-form__submit"
      type="submit"
      [disabled]="loading() || isFormInvalid()"
      [loading]="loading()"
    >
      Create account
    </button>

    <div class="auth-divider">
      <span>or</span>
    </div>

    <app-google-sign-in></app-google-sign-in>
  </form>
</app-auth-card>
