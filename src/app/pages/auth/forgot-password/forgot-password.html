<div class="auth-container">
  <div class="auth-card card">
    <button class="btn-back back-btn" routerLink="/auth/login">
      <svg lucideArrowLeft aria-hidden="true"></svg>
    </button>
    
    <div class="auth-header stack" style="gap: var(--space-xs); align-items: center; text-align: center; margin-bottom: var(--space-lg);">
      <h2 class="section__title" style="margin: 0;">Reset Password</h2>
      <p style="color: var(--text-secondary); font-size: var(--font-size-md);">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    @if (success()) {
      <div class="success-message surface-container" style="padding: var(--space-md); border-radius: var(--radius-md); text-align: center; color: var(--text-primary);">
        <p style="margin-bottom: var(--space-xs);">If an account exists for <strong>{{ email() }}</strong>, you will receive a password reset link shortly.</p>
        <p style="color: var(--text-secondary); font-size: var(--font-size-sm);">Please check your inbox and spam folder.</p>
        <div style="margin-top: var(--space-lg);">
          <a routerLink="/auth/login" class="btn btn--primary btn--full" style="text-decoration: none;">Return to Log In</a>
        </div>
      </div>
    } @else {
      <form class="stack" (submit)="onSubmit($event)">
        <div class="field">
          <label for="email" class="field__label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="field__input"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
            [disabled]="loading()"
          />
        </div>

        <button type="submit" class="btn btn--primary btn--full" [disabled]="loading() || !email()">
          @if (loading()) {
            <svg lucideLoaderCircle class="spin" aria-hidden="true" style="width: 18px; height: 18px;"></svg>
          } @else {
            Send Reset Link
          }
        </button>
      </form>
    }
  </div>
</div>
