<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/auth/login" class="back-link">
        <svg lucideArrowLeft aria-hidden="true"></svg>
      </a>
      <h2>Reset Password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    @if (success()) {
      <div class="success-message">
        <p>If an account exists for <strong>{{ email() }}</strong>, you will receive a password reset link shortly.</p>
        <p>Please check your inbox and spam folder.</p>
        <div class="auth-footer" style="margin-top: 1.5rem">
          <a routerLink="/auth/login" class="auth-link">Return to Log In</a>
        </div>
      </div>
    } @else {
      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
            [disabled]="loading()"
          />
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading() || !email()">
          @if (loading()) {
            <svg lucideLoaderCircle class="spin" aria-hidden="true"></svg>
          } @else {
            Send Reset Link
          }
        </button>
      </form>
    }
  </div>
</div>
