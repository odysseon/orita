<app-seo [config]="seoConfig"></app-seo>

<div class="location-page">
  <div class="location-card">
    <div class="location-header">
      <h1 class="location-title">Welcome to Oríta 🌍</h1>
      <p class="location-subtitle">
        To show what's happening around you, we need to know where you're exploring.
      </p>
    </div>

    <button
      class="btn btn--primary btn--full location-gps-btn"
      (click)="useCurrentLocation()"
      [disabled]="isLocating()"
    >
      @if (isLocating()) {
        <svg lucideLoaderCircle class="spinner" aria-hidden="true"></svg>
        Locating...
      } @else {
        <svg lucideMapPin aria-hidden="true"></svg>
        Use my current location
      }
    </button>

    <div class="location-divider">
      <span>or search a city</span>
    </div>

    <div class="location-search-wrapper">
      <svg lucideSearch class="search-icon" aria-hidden="true"></svg>
      <input
        type="text"
        class="search-input"
        placeholder="Enter city, neighborhood..."
        [formControl]="searchControl"
      />
    </div>

    @if (searchResults()) {
      <div class="search-results">
                @for (result of searchResults()!; track result.id) {
          <button class="search-result-item" (click)="selectLocation(result)">
            <svg lucideMapPin class="result-icon"></svg>
            <div class="result-text">
              <span class="result-name">{{ result.name }}</span>
              <span class="result-display">{{ result.formattedAddress }}</span>
            </div>
          </button>
        }
      </div>
    } @else if (isSearching() && searchControl.value?.trim()) {
      <div class="search-loading">
        Searching...
      </div>
    }

    <button class="btn btn--ghost location-skip-btn" (click)="skip()">
      Skip for now
      <svg lucideArrowRight aria-hidden="true"></svg>
    </button>
  </div>
</div>
