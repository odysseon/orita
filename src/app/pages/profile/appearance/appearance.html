<div class="appearance-page">
  <p class="appearance-hint">
    Choose how Orita looks to you. System follows your device preference automatically.
  </p>

  <ui-list>
    @for (option of options; track option.value) {
    <label uiListItem>
      <div uiListItemStart class="theme-option__icon">
        <svg [lucideIcon]="option.icon" aria-hidden="true"></svg>
      </div>
      <div uiListItemContent>
        <div uiListItemTitle>{{ option.label }}</div>
        <div uiListItemDescription>{{ option.description }}</div>
      </div>
      <div uiListItemEnd>
        <input 
          type="radio" 
          app-radio 
          name="themePreference"
          [value]="option.value"
          [checked]="theme.preference() === option.value"
          (change)="select(option.value)"
        />
      </div>
    </label>
    }
  </ui-list>
</div>
