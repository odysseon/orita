<ui-drawer [(open)]="isOpen" position="bottom" title="Start your business" size="lg">
  <div class="create-biz-wrapper">
    <div class="create-biz-header">
      <div class="create-biz-header__icon">
        <svg lucideStore aria-hidden="true"></svg>
      </div>
      <h1 class="create-biz-header__title">Start your business</h1>
      <p class="create-biz-header__subtitle">
        A few details to get you set up. You can fill in the rest later.
      </p>
    </div>

    <form class="create-biz-form" (submit)="onSubmit($event)">
      <!-- Name -->
      <app-form-field
        label="Business name"
        fieldId="name"
        [invalid]="businessForm.name().invalid()"
        [errorMessage]="businessForm.name().errors()[0]?.message"
      >
        <input
          id="name"
          app-input
          class="app-input"
          type="text"
          placeholder="e.g. Tunde's Electronics"
          autocomplete="organization"
          [formField]="businessForm.name"
          [attr.aria-invalid]="businessForm.name().touched() && businessForm.name().invalid()"
        />
      </app-form-field>


      <!-- Category -->
      <app-form-field
        label="Category"
        fieldId="primaryCategoryId"
        [invalid]="businessForm.primaryCategoryId().invalid()"
        [errorMessage]="businessForm.primaryCategoryId().errors()[0]?.message"
      >
        <ui-category-picker
          [categoryId]="model().primaryCategoryId"
          (categoryIdChange)="onCategoryPicked($event)"
          [attr.aria-invalid]="businessForm.primaryCategoryId().touched() && businessForm.primaryCategoryId().invalid()"
        ></ui-category-picker>
      </app-form-field>

      <!-- Phone -->
      <app-form-field
        label="Phone Number"
        fieldId="contactPhone"
        [invalid]="businessForm.contactPhone().invalid()"
        [errorMessage]="businessForm.contactPhone().errors()[0]?.message"
      >
        <input
          id="contactPhone"
          app-input
          class="app-input"
          type="tel"
          [placeholder]="phonePlaceholder()"
          autocomplete="tel"
          [formField]="businessForm.contactPhone"
          [attr.aria-invalid]="businessForm.contactPhone().touched() && businessForm.contactPhone().invalid()"
        />
        @if (phoneWarning()) {
          <div style="font-size: var(--font-size-sm); color: var(--color-warning-600); margin-top: var(--size-4); display: flex; align-items: flex-start; gap: var(--size-4);">
            <svg lucideGlobe aria-hidden="true" style="width: var(--size-14); height: var(--size-14); flex-shrink: 0; margin-top: var(--size-2);"></svg>
            <span>{{ phoneWarning() }}</span>
          </div>
        }
      </app-form-field>

      <!-- Description -->
      <app-form-field
        label="Description"
        fieldId="description"
        [invalid]="businessForm.description().invalid()"
        [errorMessage]="businessForm.description().errors()[0]?.message"
      >
        <textarea
          id="description"
          app-textarea
          class="app-textarea"
          placeholder="Describe what your business offers...

Example:
We sell smartphones, accessories and laptops.
We also repair damaged phones and offer same-day screen replacement."
          rows="5"
          [formField]="businessForm.description"
          [attr.aria-invalid]="businessForm.description().touched() && businessForm.description().invalid()"
        ></textarea>
      </app-form-field>

      <!-- Location -->
      <app-form-field
        label="Business Location"
        fieldId="location"
        [invalid]="businessForm.location().invalid()"
        [errorMessage]="businessForm.location().errors()[0]?.message"
      >
        @if (model().location) {
          <div class="app-input" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: var(--size-8);">
              <svg lucideMapPin aria-hidden="true" style="width: var(--size-16); height: var(--size-16);"></svg>
              <span>{{ model().location }}</span>
            </div>
            <button app-button type="button" appearance="ghost" size="sm" (click)="model.update(m => ({ ...m, location: '', latitude: 0, longitude: 0 }))">Change</button>
          </div>
        } @else {
          <ui-location-picker triggerLabel="Pick location" (confirmed)="onLocationPicked($event)"></ui-location-picker>
        }
      </app-form-field>

      <p class="create-biz-form__legal" style="font-size: var(--font-size-sm); color: var(--color-gray-500); text-align: center; margin-bottom: var(--size-16);">
        By creating a business, you agree to our 
        <a routerLink="/legal/terms" style="color: var(--color-primary-600); text-decoration: underline;">Terms of Service</a> and 
        <a routerLink="/legal/privacy" style="color: var(--color-primary-600); text-decoration: underline;">Privacy Policy</a>.
      </p>

      <button app-button intent="primary" fullWidth class="create-biz-submit" type="submit" [disabled]="isFormInvalid()" [loading]="loading()">
        Create business
      </button>
    </form>
  </div>
</ui-drawer>
