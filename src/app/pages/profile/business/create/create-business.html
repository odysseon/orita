<ui-drawer [(open)]="isOpen" position="bottom" title="Start your business" size="70%">
  <div class="create-biz-wrapper">
    <div class="create-biz-header">
      <div class="create-biz-header__icon">
        <svg lucideStore aria-hidden="true"></svg>
      </div>
      <h1 class="create-biz-header__title">Start your business</h1>
      <p class="create-biz-header__subtitle">
        A few details to get you set up. You can fill in the rest later.
      </p>
    </div>

    <form class="create-biz-form" (submit)="onSubmit($event)">
      <!-- Name -->
      <app-form-field
        label="Business name"
        fieldId="name"
        [touched]="businessForm.name().touched()"
        [invalid]="businessForm.name().invalid()"
        [errorMessage]="businessForm.name().errors()[0]?.message"
      >
        <input
          id="name"
          class="field__input"
          type="text"
          placeholder="e.g. Tunde's Electronics"
          autocomplete="organization"
          [formField]="businessForm.name"
          [class.field__input--error]="businessForm.name().touched() && businessForm.name().invalid()"
        />
      </app-form-field>


      <!-- Category -->
      <app-form-field
        label="Category"
        fieldId="primaryCategoryId"
        [touched]="businessForm.primaryCategoryId().touched()"
        [invalid]="businessForm.primaryCategoryId().invalid()"
        [errorMessage]="businessForm.primaryCategoryId().errors()[0]?.message"
      >
        <select
          id="primaryCategoryId"
          class="field__input field__select"
          [formField]="businessForm.primaryCategoryId"
          [class.field__input--error]="businessForm.primaryCategoryId().touched() && businessForm.primaryCategoryId().invalid()"
        >
          <option value="" disabled selected>Select a category</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </app-form-field>

      <!-- Phone -->
      <app-form-field
        label="Phone Number"
        fieldId="phoneNumber"
        [touched]="businessForm.phoneNumber().touched()"
        [invalid]="businessForm.phoneNumber().invalid()"
        [errorMessage]="businessForm.phoneNumber().errors()[0]?.message"
      >
        <input
          id="phoneNumber"
          class="field__input"
          type="tel"
          placeholder="e.g. +2348000000000"
          autocomplete="tel"
          [formField]="businessForm.phoneNumber"
          [class.field__input--error]="businessForm.phoneNumber().touched() && businessForm.phoneNumber().invalid()"
        />
      </app-form-field>

      <!-- Description -->
      <app-form-field
        label="Description"
        fieldId="description"
        [touched]="businessForm.description().touched()"
        [invalid]="businessForm.description().invalid()"
        [errorMessage]="businessForm.description().errors()[0]?.message"
      >
        <textarea
          id="description"
          class="field__input field__textarea"
          placeholder="Describe what your business offers...

Example:
We sell smartphones, accessories and laptops.
We also repair damaged phones and offer same-day screen replacement."
          rows="5"
          [formField]="businessForm.description"
          [class.field__input--error]="businessForm.description().touched() && businessForm.description().invalid()"
        ></textarea>
      </app-form-field>

      <!-- Location -->
      <app-form-field
        label="Business Location"
        fieldId="location"
        [touched]="businessForm.location().touched()"
        [invalid]="businessForm.location().invalid()"
        [errorMessage]="businessForm.location().errors()[0]?.message"
      >
        @if (model().location) {
          <div class="field__input" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: var(--size-8);">
              <svg lucideMapPin aria-hidden="true" style="width: var(--size-16); height: var(--size-16);"></svg>
              <span>{{ model().location }}</span>
            </div>
            <button type="button" class="btn btn--ghost btn--sm" (click)="model.update(m => ({ ...m, location: '', latitude: 0, longitude: 0 }))">Change</button>
          </div>
        } @else {
          <app-location-selector (locationSelected)="onLocationPicked($event)" />
        }
      </app-form-field>

      <button class="btn btn--primary btn--full create-biz-submit" type="submit" [disabled]="loading() || isFormInvalid()">
        @if (loading()) {
        <svg lucideLoaderCircle class="create-biz-submit__spinner" aria-hidden="true"></svg>
        Creating… } @else { Create business }
      </button>
    </form>
  </div>
</ui-drawer>
