<button
  app-button
  [intent]="intent()"
  [appearance]="appearance()"
  [size]="size()"
  [layout]="layout()"
  [fullWidth]="fullWidth()"
  [disabled]="disabled()"
  [loading]="loading()"
  [attr.aria-pressed]="isFollowed()"
  (click)="$event.stopPropagation(); $event.preventDefault(); toggle.emit(!isFollowed())"
>
  <span>{{ label() }}</span>
</button>
