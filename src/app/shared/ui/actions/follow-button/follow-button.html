<button
  type="button"
  app-button
  [intent]="intent()"
  [appearance]="appearance()"
  [size]="size()"
  [layout]="layout()"
  [fullWidth]="fullWidth()"
  [shape]="display() === 'icon' ? 'square' : 'default'"
  [disabled]="isDisabled()"
  [attr.aria-label]="display() === 'icon' ? label() : null"
  [attr.aria-pressed]="isFollowed()"
  (click)="toggle.emit()"
>
  @if (display() !== 'text') { @if (loading()) {
  <svg lucideLoaderCircle class="animate-spin" aria-hidden="true"></svg>
  } @else if (isFollowed()) {
  <svg lucideUserCheck aria-hidden="true"></svg>
  } @else {
  <svg lucideUserPlus aria-hidden="true"></svg>
  } } @if (display() !== 'icon') {
  <span>{{ label() }}</span>
  }
</button>
