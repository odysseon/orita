<button
  type="button"
  app-button
  intent="primary"
  [appearance]="appearance()"
  shape="circle"
  size="icon"
  [disabled]="disabled()"
  [loading]="loading()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="isSaved()"
  (click)="$event.stopPropagation(); $event.preventDefault(); toggle.emit(!isSaved())"
>
  <svg lucideBookmark [class.is-saved]="isSaved()" aria-hidden="true"></svg>
</button>
