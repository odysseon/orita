<app-card appearance="outlined" padding="none" radius="lg" class="ui-business-card-container">
  @if (coverUrl()) {
    <a [routerLink]="getLink()" class="ui-business-card__media-link">
      <ui-cover-media [src]="coverUrl()" aspectRatio="4/3" [overlayGradient]="true"></ui-cover-media>
    </a>
  }

  <div class="ui-business-card__body">
    <ui-business-identity
      [business]="business()"
      size="md"
      [verificationStatus]="business().isVerified ? 'verified' : 'unverified'"
      [link]="getLink()"
    />
  </div>
</app-card>
