<app-card appearance="outlined" padding="none" radius="lg" class="ui-business-card-container">
  @if (coverUrl()) {
    <a [routerLink]="getLink()" class="ui-business-card__media-link">
      <ui-cover-media [src]="coverUrl()" aspectRatio="4/3" [overlayGradient]="true"></ui-cover-media>
    </a>
  }

  <div class="ui-business-card__body">
    <ui-business-identity
      [business]="business()"
      size="md"
      [verificationStatus]="business().isVerified ? 'verified' : 'unverified'"
      [link]="getLink()"
    />

    <div class="ui-business-card__actions">
      @if (showFollow()) {
        <div class="ui-business-card__follow">
          <ui-follow-button
            [isFollowed]="business().isFollowed ?? false"
            [fullWidth]="true"
            size="sm"
            (toggle)="followToggle.emit($event)"
          ></ui-follow-button>
        </div>
      }
      @if (showShare()) {
        <ui-share-button size="sm" (share)="showShareModal.set(true)" />
      }
    </div>
  </div>
</app-card>

@if (showShare()) {
  <ui-share-modal
    [isOpen]="showShareModal()"
    (close)="showShareModal.set(false)"
    embedType="BUSINESS"
    [targetId]="business().id"
    [targetSlug]="business().slug || undefined"
    [title]="business().name"
    [imageUrl]="business().logoUrl || undefined"
  />
}
