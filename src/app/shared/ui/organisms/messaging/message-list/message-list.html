<div class="message-list-container" #scrollContainer>
      @if (status() === 'loading' && messages().length === 0) {
        <div class="message-list-skeleton">
          <app-skeleton style="height: var(--size-40); width: 55%; border-radius: var(--radius-lg); align-self: flex-start; margin-bottom: var(--size-12);"></app-skeleton>
          <app-skeleton style="height: var(--size-40); width: 65%; border-radius: var(--radius-lg); align-self: flex-end; margin-bottom: var(--size-12);"></app-skeleton>
          <app-skeleton style="height: var(--size-56); width: 70%; border-radius: var(--radius-lg); align-self: flex-start; margin-bottom: var(--size-12);"></app-skeleton>
          <app-skeleton style="height: var(--size-40); width: 50%; border-radius: var(--radius-lg); align-self: flex-end; margin-bottom: var(--size-12);"></app-skeleton>
          <app-skeleton style="height: var(--size-40); width: 60%; border-radius: var(--radius-lg); align-self: flex-start; margin-bottom: var(--size-12);"></app-skeleton>
        </div>
      } @else if (messages().length === 0) {
        <div class="empty-view">
          <p>No messages yet. Start the conversation!</p>
        </div>
      } @else {
        <div class="message-list-content">
          @for (msg of messages(); track msg.id) {
            <ui-message-bubble 
              [message]="msg" 
              [isMine]="msg.participantId === viewerParticipantId() || msg.syncState !== undefined" 
              (retry)="retryMessage.emit(msg.id)"
              (discard)="discardMessage.emit(msg.id)"
            />
          }
        </div>
      }
    </div>
