<ui-drawer
  [open]="isOpen()"
  (closed)="onDrawerClose()"
  position="bottom"
  size="lg"
  [showCloseButton]="false"
>
  <div class="attach-sheet-content">

    <!-- Tab Bar -->
    <div style="padding: var(--space-sm) var(--space-sm) 0; margin-bottom: var(--size-16);">
      <ui-tabs [value]="activeTab()" (valueChange)="onTabChanged($event)">
        <ui-tab-list appearance="pill" size="md">
          <button app-button app-tab-trigger value="ORITA">Orita</button>
          <button app-button app-tab-trigger value="MEDIA">Media</button>
        </ui-tab-list>
      </ui-tabs>
    </div>

    @if (activeTab() === 'ORITA') {
      @defer (when activeTab() === 'ORITA') {
        <ui-attach-sheet-orita-tab
          [isOpen]="isOpen()"
          (itemSelected)="onItemSelected($event)"
        />
      }
    } @else {
      <!-- Media Tab -->
      <div class="tab-content media-tab">
        <label class="media-btn">
          <input
            type="file"
            accept="image/*,video/*"
            capture="environment"
            class="hidden-file-input"
            (change)="handleFileSelected($event, 'CAMERA')"
          />
          <svg lucideCamera aria-hidden="true"></svg>
          <span>Camera</span>
        </label>
        <label class="media-btn">
          <input
            type="file"
            accept="image/*,video/*,audio/*,application/pdf"
            multiple
            class="hidden-file-input"
            (change)="handleFileSelected($event, 'GALLERY')"
          />
          <svg lucideFileImage aria-hidden="true"></svg>
          <span>Photos &amp; Media</span>
        </label>
        <label class="media-btn">
          <input
            type="file"
            multiple
            class="hidden-file-input"
            (change)="handleFileSelected($event, 'FILES')"
          />
          <svg lucidePackage aria-hidden="true"></svg>
          <span>Files</span>
        </label>
      </div>
    }
  </div>
</ui-drawer>
