<header class="chat-header">
      <button app-button appearance="ghost" shape="square" class="btn-back" (click)="back.emit()" aria-label="Back">
        <svg lucideChevronLeft aria-hidden="true"></svg>
      </button>

      <div class="chat-title-info">
        <app-avatar
          [src]="conversation()?.avatarUrl"
          [alt]="conversation()?.title || 'User'"
          [fallback]="(conversation()?.title || 'U').charAt(0).toUpperCase()"
          size="md"
        ></app-avatar>
        <div class="chat-title-text">
          <h2>{{ conversation()?.title }}</h2>
          <span class="online-status">Online</span>
        </div>
      </div>

      <button app-button appearance="ghost" shape="square" class="btn-icon" aria-label="More options">
        <svg lucideMoreVertical aria-hidden="true"></svg>
      </button>
    </header>
