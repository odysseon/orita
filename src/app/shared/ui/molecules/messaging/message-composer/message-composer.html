<div class="composer-container">
  @if (draftEmbeds().length > 0 || attachments().length > 0) {
  <div class="composer-attachments">
    @for (embed of draftEmbeds(); track embed.targetId) {
    <ui-listing-search-result
      [showSave]="false"
      [embedType]="embed.embedType"
      [listing]="{ id: embed.targetId, title: 'Shared ' + embed.embedType, thumbnailUrl: null, price: 0 }"
      style="display: block; width: fit-content; background: var(--surface-container); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 8px;"
    >
      <button result-action app-button appearance="ghost" shape="circle" size="xs"
        class="attachment-chip__remove"
        (click)="removeEmbed(embed.targetId)" aria-label="Remove">
        <svg lucideX aria-hidden="true"></svg>
      </button>
    </ui-listing-search-result>
    } @for (att of attachments(); track att.id) {
    <div class="attachment-chip">
      <div class="attachment-chip__icon">
        @if (att.kind === 'IMAGE') {
        <img [src]="att.previewUrl" class="attachment-preview-img" alt="preview" />
        } @else if (att.kind === 'VIDEO') {
        <svg lucideVideo aria-hidden="true"></svg>
        } @else {
        <svg lucideFile aria-hidden="true"></svg>
        }
      </div>
      <div class="attachment-chip__info">
        <span class="attachment-chip__title">{{ att.file.name }}</span>
      </div>
      <button
        app-button
        appearance="ghost"
        shape="circle"
        size="xs"
        class="attachment-chip__remove"
        (click)="removeAttachment(att.id)"
      >
        <svg lucideX aria-hidden="true"></svg>
      </button>
    </div>
    }
  </div>
  }

  <div class="composer-input-row">
    <ui-attach-button (attach)="showAttachSheet.set(true)" />

    <div class="input-wrapper">
      <input
        type="text"
        class="composer-input"
        placeholder="Type a message..."
        aria-label="Message"
        [value]="content()"
        (input)="content.set($any($event.target).value)"
        (keyup.enter)="onSend()"
      />
    </div>

    <ui-send-button
      [disabled]="!content().trim() && draftEmbeds().length === 0 && attachments().length === 0"
      (send)="onSend()"
    />
  </div>
</div>

<ui-attach-sheet
  [isOpen]="showAttachSheet()"
  (close)="showAttachSheet.set(false)"
  [conversationId]="conversationId()"
  (attachmentSelected)="onAttachmentSelected($event)"
/>
