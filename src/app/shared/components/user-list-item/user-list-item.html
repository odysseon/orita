<li class="user-item" [class.selected]="selected()" (click)="onToggle($event)">
  <div class="user-avatar">
    <app-avatar [src]="avatarUrl()" [alt]="displayName() || username()" size="md"></app-avatar>
  </div>
  <div class="user-details">
    <span class="user-name">{{ displayName() || username() }}</span>
    <span class="user-handle">{{ '@' + username() }}</span>
  </div>
  <div class="user-action">
    @if (sent()) {
      <span class="sent-badge"><svg lucideCheck></svg> Sent</span>
    } @else {
      <div class="selection-indicator">
        @if (selected()) {
          <svg lucideCheck class="check-icon"></svg>
        }
      </div>
    }
  </div>
</li>
