<div class="field">
  <label class="field__label" [for]="fieldId()">
    {{ label() }}
    @if (hint()) {
      <span class="field__label-hint">{{ hint() }}</span>
    }
  </label>
  <ng-content />
  @if (touched() && invalid() && errorMessage()) {
    <p class="field__error" role="alert">{{ errorMessage() }}</p>
  }
</div>
