<div class="sub-layout">
  <ui-app-header [showLogo]="false" [showLocationPill]="false" [uiScrollHide]="true" scrollHidePosition="top">
    <div class="sub-layout__header">
      <button class="btn-back" (click)="handleBack()" type="button" aria-label="Go back">
        <svg lucideArrowLeft aria-hidden="true"></svg>
        Back
      </button>
      @if (title()) {
        <h1 class="page-title">{{ title() }}</h1>
      }
    </div>
  </ui-app-header>
  
  <div class="sub-layout__content">
    <router-outlet (activate)="onActivate($event)" />
  </div>
</div>
