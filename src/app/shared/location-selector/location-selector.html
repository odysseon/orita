<div class="location-selector">
  <button app-button intent="primary" class="btn--full drawer-gps-btn"
    
    (click)="useCurrentLocation()"
    [disabled]="isLocating()"
  >
    @if (isLocating()) {
      <svg lucideLoaderCircle class="spinner" aria-hidden="true"></svg>
      Locating...
    } @else {
      <svg lucideMapPin aria-hidden="true"></svg>
      Use my current location
    }
  </button>

  <div class="drawer-divider">
    <span>or search a city</span>
  </div>

  <div class="drawer-search-wrapper">
    <svg lucideSearch class="drawer-search-icon" aria-hidden="true"></svg>
    <input
      type="text"
      class="drawer-search-input"
      placeholder="Enter city, neighborhood..."
      [value]="searchQuery()"
      (input)="searchQuery.set($any($event.target).value)"
    />
  </div>

  @if (searchResults()) {
    <div class="drawer-search-results">
      @for (result of searchResults()!; track result.name) {
        <button class="search-result-item" (click)="selectLocation(result)">
          <svg lucideMapPin class="result-icon"></svg>
          <div class="result-text">
            <span class="result-name">{{ result.formattedAddress }}</span>
            <span class="result-display">{{ result.name }}</span>
          </div>
        </button>
      }
    </div>
  } @else if (isSearching() && searchQuery().trim()) {
    <div class="drawer-search-loading">
      Searching...
    </div>
  }
</div>
