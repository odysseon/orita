<div class="share-sheet">
  <div class="header">
    <h3>Share</h3>
  </div>

  @if (status() !== 'idle') {
    <div class="status-overlay">
      <div class="spinner"></div>
      <p>{{ status() }}...</p>
    </div>
  }

  <div class="section">
    <h4>Recent Chats</h4>
    @if (recentChats().length > 0) {
      <ul class="chat-list">
        @for (chat of recentChats(); track chat.id) {
          <li class="chat-item" (click)="onConversationSelected(chat.id)">
            <div class="chat-avatar"></div>
            <div class="chat-details">
              <!-- Simple display for now assuming chat has some identifier -->
              <span>Conversation</span>
            </div>
          </li>
        }
      </ul>
    } @else {
      <p class="empty-state">No recent chats. Search for someone to start a conversation.</p>
    }
  </div>

  <div class="section">
    <h4>Search People</h4>
    <app-people-search (selected)="onUserSelected($event)"></app-people-search>
  </div>

  <div class="section actions">
    <button class="action-btn" (click)="copyLink()">
      <svg lucideLink class="icon" aria-hidden="true"></svg> Copy Link
    </button>
    
    @if (canNativeShare) {
      <button class="action-btn" (click)="nativeShare()">
        <svg lucideShare class="icon" aria-hidden="true"></svg> Share via...
      </button>
    }
  </div>
</div>
