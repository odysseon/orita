<button
  [class]="variant() === 'icon' ? 'btn-icon'
    : variant() === 'action' ? 'action-btn'
    : variant() === 'overlay' ? 'btn-overlay'
    : 'btn btn--' + variant()"
  [class.btn-icon--active]="variant() === 'icon' && followed()"
  [class.action-btn--active]="variant() === 'action' && followed()"
  [class.btn-overlay--active]="variant() === 'overlay' && followed()"
  [disabled]="following()"
  (click)="onToggle($event)"
  type="button"
  [attr.aria-label]="followed() ? 'Unfollow' : 'Follow'"
>
  <svg lucideHeart [class.filled]="followed()" aria-hidden="true"></svg>
  @if (variant() !== 'icon' && variant() !== 'overlay') {
  <span>{{ followed() ? 'Following' : 'Follow' }}</span>
  }
</button>
