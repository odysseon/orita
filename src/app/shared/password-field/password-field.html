<app-form-field
  [label]="label()"
  [fieldId]="fieldId()"
  [touched]="touched()"
  [invalid]="invalid()"
  [errorMessage]="errorMessage()"
>
  <div class="field__input-wrap">
    <input
      app-input
      [type]="showPassword() ? 'text' : 'password'"
      [id]="fieldId()"
      [formField]="formField()"
      [attr.aria-invalid]="touched() && invalid() ? 'true' : null"
    />
    <button
      class="field__toggle"
      type="button"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      (click)="togglePassword()"
    >
      @if (showPassword()) {
        <svg lucideEyeOff aria-hidden="true"></svg>
      } @else {
        <svg lucideEye aria-hidden="true"></svg>
      }
    </button>
  </div>
</app-form-field>
