<a class="listing-card" [routerLink]="['/l', item().slug]">
  <div class="listing-card__image-wrapper">
    @if (item().coverUrl) {
    <img [src]="item().coverUrl" [alt]="item().title" class="listing-card__image" />
    } @else {
    <div class="listing-card__placeholder">
      <svg lucidePackage aria-hidden="true"></svg>
    </div>
    }

    <!-- Gradient overlay for better text contrast and premium feel -->
    <div class="listing-card__overlay"></div>

    <!-- Actions (like Save) -->
    <div class="listing-card__actions">
      <button class="listing-card__save-btn" (click)="toggleSave($event)" aria-label="Save">
        <svg lucideBookmark class="listing-card__saved" [class.is-saved]="item().isSaved" aria-hidden="true"></svg>
      </button>
    </div>

    <!-- Floating Price Badge -->
    <div class="listing-card__price-badge">
      {{ formatPrice(item()) }}
    </div>
  </div>

  <div class="listing-card__body">
    <h3 class="listing-card__title">{{ item().title }}</h3>
  </div>
</a>
