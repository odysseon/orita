<button
  app-button
  [appearance]="computedAppearance()"
  [shape]="shape()"
  [size]="size()"
  [intent]="computedIntent()"
  (click)="onShare()"
  type="button"
  [attr.aria-label]="label()"
>
  <svg lucideShare aria-hidden="true"></svg>
  @if (variant() !== 'icon') {
    <span>{{ label() }}</span>
  }
</button>
