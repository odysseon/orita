<div class="location-info">
  <h3 class="location-name">{{ location().name }}</h3>
  @if (location().formattedAddress) {
    <p class="location-address">{{ location().formattedAddress }}</p>
  }
</div>

<button 
  class="follow-btn" 
  [class.following]="location().isFollowed"
  [disabled]="isPending()"
  (click)="toggleFollow()"
>
  @if (isPending()) {
    {{ location().isFollowed ? 'Unfollowing...' : 'Following...' }}
  } @else {
    {{ location().isFollowed ? 'Following' : 'Follow' }}
  }
</button>
