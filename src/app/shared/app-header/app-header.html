<header class="app-header">
  <div class="header-left">
    @if (showLogo()) {
      <div class="header-brand">
        <app-logo />
      </div>
    }
    <ng-content select="[left-content]"></ng-content>
  </div>

  @if (pageTitle()) {
    <div class="header-title absolute-center">
      <h1>{{ pageTitle() }}</h1>
    </div>
  } @else {
    <div class="header-center absolute-center">
      @if (showLocationPill()) {
        <button app-button appearance="soft" shape="pill" class="location-pill" (click)="toggleDrawer()">
          <svg lucideMapPin aria-hidden="true"></svg>
          <span>{{ activeLocation()?.name || 'Set location' }}</span>
          <svg lucideChevronDown aria-hidden="true"></svg>
        </button>
      }
      <ng-content select="[center-content]"></ng-content>
    </div>
  }

  <div class="header-actions">
    <ng-content></ng-content>
    @if (showProfileBtn()) {
      <app-avatar
        [authenticated]="!!authService.token()"
        [src]="authService.currentUser()?.avatarUrl"
        [alt]="authService.currentUser()?.username || '?'"
        [fallback]="authService.currentUser()?.username ? authService.currentUser()!.username.charAt(0).toUpperCase() : '?'"
        size="sm"
        (click)="goToProfile()"
        (guestClick)="goToProfile()"
      ></app-avatar>
    }
  </div>
</header>

<ui-drawer
  [open]="isLocationPickerOpen()"
  (openChange)="isLocationPickerOpen.set($event)"
  [position]="isDesktop() ? 'center' : 'bottom'"
  [size]="isDesktop() ? '400px' : '85vh'"
  title="Change Location"
>
  <div style="padding: var(--size-16);">
    <app-location-selector (locationSelected)="selectLocation($event)" />
  </div>
</ui-drawer>
