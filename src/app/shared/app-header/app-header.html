<header class="app-header">
  @if (showLogo()) {
    <div class="header-brand">
      <app-logo />
    </div>
  }
  @if (showLocationPill()) {
    <button class="location-pill" (click)="toggleDrawer()">
      <img src="/favicon.svg" alt="Orita Logo" class="app-logo-icon" aria-hidden="true" />
      <span>{{ activeLocation()?.name || 'Set location' }}</span>
      <svg lucideChevronDown aria-hidden="true"></svg>
    </button>
  }

  <div class="header-actions" [class.full-width]="!showLogo()">
    <ng-content></ng-content>
  </div>
</header>

<ui-drawer
  [open]="isLocationPickerOpen()"
  (openChange)="isLocationPickerOpen.set($event)"
  position="center"
  size="400px"
  title="Change Location"
>
  <div style="padding: var(--size-16);">
    <app-location-selector (locationSelected)="selectLocation($event)" />
  </div>
</ui-drawer>
